<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1270" height="760" viewBox="0 0 1270 760">
 <title>ReSocks 工作原理</title>
 <defs><radialGradient id="glow"><stop offset="0" stop-color="#f4dfa0" stop-opacity=".45"/><stop offset="1" stop-color="#f4dfa0" stop-opacity="0"/></radialGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#b8860b" stroke-width="2"/></marker></defs>
 <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1270" height="760" rx="0" fill="#f7f8fa"/><ellipse cx="1100" cy="90" rx="510" ry="370" fill="url(#glow)"/><text x="64" y="161" font-size="48" font-weight="700" fill="#111827" text-anchor="start">由规则决定连接路径。</text><text x="64" y="207" font-size="22" font-weight="400" fill="#5c6675" text-anchor="start">客户端匹配应用和网站规则，然后选择通过代理或直接连接。</text><path d="M64 706H1206" fill="none" stroke="#e2e6eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="735" font-size="12" font-weight="600" fill="#5c6675" text-anchor="start">自带 SOCKS5 代理</text><text x="1206" y="735" font-size="14" font-weight="600" fill="#b8860b" text-anchor="end">resocks.app</text><rect x="64" y="295" width="196" height="205" rx="22" fill="white" stroke="#e2e6eb" stroke-width="1.5"/><g transform="translate(86 319) scale(0.9)"><path d="M5 3H35V25H5Z M0 32H40 M14 25L11 32 M26 25L29 32" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="86" y="387" font-size="19" font-weight="600" fill="#111827" text-anchor="start">您的设备</text><text x="86" y="422" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">应用和网站</text><rect x="300" y="295" width="196" height="205" rx="22" fill="#fdf9ec" stroke="#e2d7b9" stroke-width="1.5"/><g transform="translate(322 319) scale(0.9)"><path d="M4 33V22Q4 16 12 16H29 M22 9L29 16L22 23 M12 16V6H34 M27 0L34 6L27 12" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="322" y="387" font-size="19" font-weight="600" fill="#111827" text-anchor="start">ReSocks 客户端</text><text x="322" y="422" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">匹配应用和</text><text x="322" y="446" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">网站规则</text><rect x="536" y="295" width="196" height="205" rx="22" fill="#fdf9ec" stroke="#e2d7b9" stroke-width="1.5"/><g transform="translate(558 319) scale(0.9)"><path d="M3 3H37V15H3Z M3 23H37V35H3Z M9 9H13 M9 29H13 M27 9H31 M27 29H31" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="558" y="387" font-size="19" font-weight="600" fill="#111827" text-anchor="start">中继服务器</text><text x="558" y="422" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">将流量中转至</text><text x="558" y="446" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">您的 SOCKS5 代理</text><rect x="772" y="295" width="196" height="205" rx="22" fill="white" stroke="#e2e6eb" stroke-width="1.5"/><g transform="translate(794 319) scale(0.9)"><path d="M3 3H37V15H3Z M3 23H37V35H3Z M9 9H13 M9 29H13 M27 9H31 M27 29H31" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="794" y="387" font-size="19" font-weight="600" fill="#111827" text-anchor="start">SOCKS5 代理</text><text x="794" y="422" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">您选择的出口</text><rect x="1008" y="295" width="196" height="205" rx="22" fill="white" stroke="#e2e6eb" stroke-width="1.5"/><g transform="translate(1030 319) scale(0.9)"><path d="M2 20A18 18 0 1 0 38 20A18 18 0 1 0 2 20 M2 20H38 M20 2C7 10 7 30 20 38C33 30 33 10 20 2" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1030" y="387" font-size="19" font-weight="600" fill="#111827" text-anchor="start">互联网</text><text x="1030" y="422" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">目标网站</text><path d="M260,397 L293,397" fill="none" stroke="#b8860b" stroke-width="3" marker-end="url(#arrow)"/><path d="M496,397 L529,397" fill="none" stroke="#b8860b" stroke-width="3" marker-end="url(#arrow)"/><path d="M732,397 L765,397" fill="none" stroke="#b8860b" stroke-width="3" marker-end="url(#arrow)"/><path d="M968,397 L1001,397" fill="none" stroke="#b8860b" stroke-width="3" marker-end="url(#arrow)"/><text x="280" y="381" font-size="13" font-weight="600" fill="#b8860b" text-anchor="middle">Tunel</text><text x="516" y="381" font-size="13" font-weight="600" fill="#b8860b" text-anchor="middle">代理</text><text x="752" y="381" font-size="13" font-weight="600" fill="#b8860b" text-anchor="middle">中转</text><path d="M398 503V541H1106V506" fill="none" stroke="#b8860b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="752" y="572" font-size="17" font-weight="600" fill="#b8860b" text-anchor="middle">直连 · 不经过中继或 SOCKS5 代理，直接连接互联网</text><rect x="64" y="594" width="1142" height="90" rx="22" fill="white" stroke="#e2e6eb" stroke-width="1.5"/><text x="88" y="627" font-size="21" font-weight="600" fill="#111827" text-anchor="start">选择您的中继。</text><text x="88" y="658" font-size="16" font-weight="400" fill="#5c6675" text-anchor="start">全球节点或自建中继。</text><path d="M627 614V664" fill="none" stroke="#e2e6eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="661" y="627" font-size="21" font-weight="600" fill="#111827" text-anchor="start">规则在客户端内匹配。</text><text x="661" y="658" font-size="16" font-weight="400" fill="#5c6675" text-anchor="start">代理路径中，TLS 保护客户端到中继之间的连接。</text></g></svg>