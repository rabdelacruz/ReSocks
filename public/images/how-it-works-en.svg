<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1270" height="760" viewBox="0 0 1270 760">
 <title>ReSocks Product Hunt launch artwork</title>
 <defs><radialGradient id="glow"><stop offset="0" stop-color="#f4dfa0" stop-opacity=".45"/><stop offset="1" stop-color="#f4dfa0" stop-opacity="0"/></radialGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#b8860b" stroke-width="2"/></marker></defs>
 <g font-family="Inter, sans-serif"><rect x="0" y="0" width="1270" height="760" rx="0" fill="#f7f8fa"/><ellipse cx="1100" cy="90" rx="510" ry="370" fill="url(#glow)"/><text x="64" y="161" font-size="48" font-weight="700" fill="#111827" text-anchor="start">Your rules decide the path.</text><text x="64" y="207" font-size="22" font-weight="400" fill="#5c6675" text-anchor="start">The client matches apps and websites, then connects through your proxy or directly.</text><path d="M64 706H1206" fill="none" stroke="#e2e6eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="735" font-size="12" font-weight="600" fill="#5c6675" text-anchor="start">BRING YOUR OWN SOCKS5</text><text x="1206" y="735" font-size="14" font-weight="600" fill="#b8860b" text-anchor="end">resocks.app</text><rect x="64" y="295" width="196" height="205" rx="22" fill="white" stroke="#e2e6eb" stroke-width="1.5"/><g transform="translate(86 319) scale(0.9)"><path d="M5 3H35V25H5Z M0 32H40 M14 25L11 32 M26 25L29 32" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="86" y="387" font-size="19" font-weight="600" fill="#111827" text-anchor="start">Your device</text><text x="86" y="422" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">Apps and websites</text><rect x="300" y="295" width="196" height="205" rx="22" fill="#fdf9ec" stroke="#e2d7b9" stroke-width="1.5"/><g transform="translate(322 319) scale(0.9)"><path d="M4 33V22Q4 16 12 16H29 M22 9L29 16L22 23 M12 16V6H34 M27 0L34 6L27 12" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="322" y="387" font-size="19" font-weight="600" fill="#111827" text-anchor="start">ReSocks Client</text><text x="322" y="422" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">Matches app and</text><text x="322" y="446" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">website rules</text><rect x="536" y="295" width="196" height="205" rx="22" fill="#fdf9ec" stroke="#e2d7b9" stroke-width="1.5"/><g transform="translate(558 319) scale(0.9)"><path d="M3 3H37V15H3Z M3 23H37V35H3Z M9 9H13 M9 29H13 M27 9H31 M27 29H31" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="558" y="387" font-size="19" font-weight="600" fill="#111827" text-anchor="start">Relay Server</text><text x="558" y="422" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">Relays traffic to</text><text x="558" y="446" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">your SOCKS5 proxy</text><rect x="772" y="295" width="196" height="205" rx="22" fill="white" stroke="#e2e6eb" stroke-width="1.5"/><g transform="translate(794 319) scale(0.9)"><path d="M3 3H37V15H3Z M3 23H37V35H3Z M9 9H13 M9 29H13 M27 9H31 M27 29H31" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="794" y="387" font-size="19" font-weight="600" fill="#111827" text-anchor="start">SOCKS5 Proxy</text><text x="794" y="422" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">Your chosen exit</text><rect x="1008" y="295" width="196" height="205" rx="22" fill="white" stroke="#e2e6eb" stroke-width="1.5"/><g transform="translate(1030 319) scale(0.9)"><path d="M2 20A18 18 0 1 0 38 20A18 18 0 1 0 2 20 M2 20H38 M20 2C7 10 7 30 20 38C33 30 33 10 20 2" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1030" y="387" font-size="19" font-weight="600" fill="#111827" text-anchor="start">Internet</text><text x="1030" y="422" font-size="15" font-weight="400" fill="#5c6675" text-anchor="start">Destination</text><path d="M260,397 L293,397" fill="none" stroke="#b8860b" stroke-width="3" marker-end="url(#arrow)"/><path d="M496,397 L529,397" fill="none" stroke="#b8860b" stroke-width="3" marker-end="url(#arrow)"/><path d="M732,397 L765,397" fill="none" stroke="#b8860b" stroke-width="3" marker-end="url(#arrow)"/><path d="M968,397 L1001,397" fill="none" stroke="#b8860b" stroke-width="3" marker-end="url(#arrow)"/><text x="280" y="381" font-size="13" font-weight="600" fill="#b8860b" text-anchor="middle">Tunel</text><text x="516" y="381" font-size="13" font-weight="600" fill="#b8860b" text-anchor="middle">Proxy</text><text x="752" y="381" font-size="13" font-weight="600" fill="#b8860b" text-anchor="middle">Relay</text><path d="M398 503V541H1106V506" fill="none" stroke="#b8860b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="752" y="572" font-size="17" font-weight="600" fill="#b8860b" text-anchor="middle">Direct · connect to the Internet without the relay or SOCKS5 proxy</text><rect x="64" y="594" width="1142" height="90" rx="22" fill="white" stroke="#e2e6eb" stroke-width="1.5"/><text x="88" y="627" font-size="21" font-weight="600" fill="#111827" text-anchor="start">Choose your relay.</text><text x="88" y="658" font-size="16" font-weight="400" fill="#5c6675" text-anchor="start">Global nodes or self-hosted.</text><path d="M627 614V664" fill="none" stroke="#e2e6eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="661" y="627" font-size="21" font-weight="600" fill="#111827" text-anchor="start">Rules are matched in the client.</text><text x="661" y="658" font-size="16" font-weight="400" fill="#5c6675" text-anchor="start">TLS protects the client-to-relay hop on the proxy path.</text></g></svg>